<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>浏览器自动化任务结果</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container-fluid">
        <header class="bg-dark text-white p-3 mb-4">
            <h1>浏览器自动化任务结果</h1>
            <div class="result-selector mt-2">
                <select id="resultSelect" class="form-select"></select>
            </div>
        </header>

        <div class="row">
            <!-- 左侧 - 摘要 -->
            <div class="col-md-3">
                <div class="card mb-4">
                    <div class="card-header bg-primary text-white">
                        <h2 class="h5 mb-0">任务摘要</h2>
                    </div>
                    <div class="card-body" id="summary-container">
                        <div class="loading">加载中...</div>
                    </div>
                </div>
            </div>

            <!-- 右侧 -->
            <div class="col-md-9">
                <!-- 任务列表 - 移动到右侧上方，并使其更紧凑 -->
                <div class="card mb-3 task-list-card">
                    <div class="card-header bg-info text-white py-2">
                        <h2 class="h5 mb-0">任务列表</h2>
                    </div>
                    <div class="card-body p-2">
                        <div class="task-list-container">
                            <ul class="task-list-horizontal" id="task-list"></ul>
                        </div>
                    </div>
                </div>
                
                <!-- 任务详情 -->
                <div class="card mb-4">
                    <div class="card-header bg-success text-white">
                        <h2 class="h5 mb-0" id="task-title">选择任务查看详情</h2>
                    </div>
                    <div class="card-body" id="task-details">
                        <div class="alert alert-info">请从上方选择一个任务以查看详情</div>
                    </div>
                </div>

                <!-- 操作历史 -->
                <div class="card" id="action-history-card" style="display: none;">
                    <div class="card-header bg-warning text-dark">
                        <h2 class="h5 mb-0">操作历史</h2>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-striped table-hover mb-0">
                                <thead class="table-dark">
                                    <tr>
                                        <th>序号</th>
                                        <th>操作类型</th>
                                        <th>结果</th>
                                        <th>状态</th>
                                    </tr>
                                </thead>
                                <tbody id="action-history"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 操作详情模态框 -->
    <div class="modal fade" id="actionModal" tabindex="-1" aria-labelledby="actionModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="actionModalLabel">操作详情</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="actionModalBody">
                    <!-- 操作详情内容 -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
